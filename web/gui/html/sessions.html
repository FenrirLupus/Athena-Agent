<div class="workspace" id="sessions-ws">
  <div class="ws-head">
    <h2>Session Files</h2>
    <span class="ws-sub" id="sessions-profile"></span>
    <div class="ws-actions">
      <button id="sessions-new">+ New Session</button>
      <button id="sessions-refresh">⟳ Refresh</button>
      <span class="ws-actions-sep"></span>
      <label class="sessions-bulk-inline"><input type="radio" name="bulk-mode" id="bulk-min" value="min" checked> at least</label>
      <label class="sessions-bulk-inline"><input type="radio" name="bulk-mode" id="bulk-max" value="max"> at most</label>
      <input type="number" id="bulk-count" min="1" step="1" value="100" class="sessions-bulk-count">
      <span class="sessions-bulk-label">entries</span>
      <button id="sessions-bulk-delete" class="sessions-bulk-btn">🗑 Delete</button>
      <span id="sessions-bulk-status" class="sessions-bulk-status"></span>
    </div>
  </div>
  <div id="sessions-list"></div>
</div>
