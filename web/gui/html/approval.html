<div id="approval-banner" style="display:none;">
  <div id="approval-card">
    <div id="approval-title">⚠ Approval Needed</div>
    <div id="approval-text"></div>
    <div id="approval-buttons">
      <button id="approval-allow">Allow</button>
      <button id="approval-deny">Deny</button>
      <button id="approval-block">Block</button>
    </div>
    <select id="approval-scope">
      <option value="once">once</option>
      <option value="session">session</option>
      <option value="global">global</option>
    </select>
  </div>
</div>
