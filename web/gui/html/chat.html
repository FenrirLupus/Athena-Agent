<div class="workspace" id="chat-ws">
  <div class="ws-head"><h2>Chat</h2><span class="ws-sub" id="chat-sub">Combined history — whoever starts is line 1</span></div>
  <!-- THE LOAD-OLDER PILL (the Operator's spec): a hoverable button centered
       at the top of the body — the approval-popup pattern, for history.
       Only visible when there are older messages. -->
  <div id="chat-load-more-wrap">
    <button id="chat-load-more">Load older messages</button>
  </div>
  <!-- THE COMBINED HISTORY (the Operator's spec): ONE column, alternating —
       whoever started the conversation is line 1, the opposite side is
       line 2, and so on (Athena > User > Athena > User, or swapped). -->
  <div id="chat-panels">
    <div class="chat-col" id="chat-history"><!-- loaded from history --></div>
  </div>
  <!-- THE COMMAND PALETTE (the Operator's spec): typing / or \ in the input
       pops a FILE-SYSTEM-TREE panel — categories (folders) on the LEFT,
       drill into commands + subcommands, usage syntax on the RIGHT. The
       breadcrumb shows the path; each level is clickable to go back. -->
  <div id="cmd-palette" style="display:none;">
    <div class="cmd-breadcrumb" id="cmd-breadcrumb"></div>
    <div class="cmd-body">
      <div class="cmd-left" id="cmd-list"></div>
      <div class="cmd-right" id="cmd-usage"></div>
    </div>
  </div>
  <div id="chat-input-row">
    <div class="chat-qa-wrap" id="chat-qa-wrap">
      <button id="chat-qa" class="chat-qa-btn">Quick Menu</button>
      <div id="chat-qa-menu" class="chat-qa-menu" style="display:none;">
        <!-- THE QUICK ACCESS MENU (the Operator's 08-15 spec): the
             Emoji/Emote menu + the system commands + the md preview
             toggle — real options, not placeholders. -->
        <div class="chat-qa-head">Quick Menu</div>
        <div class="chat-qa-opt" data-qa="emoji">😀 Emoji / Emote Menu</div>
        <div class="chat-qa-opt" data-qa="md-preview">👁️ Toggle Markdown Preview</div>
        <div class="chat-qa-opt" data-qa="interrupt">⏹️ Interrupt (stop mid-turn)</div>
        <div class="chat-qa-opt" data-qa="restart">🔄 Restart runtime</div>
        <div class="chat-qa-opt" data-qa="refresh">♻️ Refresh (reload skills)</div>
      </div>
    </div>
    <button id="chat-attach" class="chat-icon-btn" title="Attach files (copied to the agent's documents/<type>/ store)">📎</button>
    <textarea id="chat-input" rows="1" placeholder="Message Athena…" autocomplete="off"></textarea>
    <button id="chat-mic" class="chat-icon-btn chat-mic-placeholder" title="Push to talk (coming soon)">🎙️</button>
    <button id="chat-send">Send</button>
    <div id="chat-emoji-picker" class="chat-emoji-picker" style="display:none"></div>
    <!-- THE MARKDOWN LIVE PREVIEW (the Operator's 08-15 spec): renders
         the draft as the operator types — hidden until toggled or until
         the draft contains markdown. -->
    <div id="chat-md-preview" class="chat-md-preview" style="display:none"></div>
  </div>
  <input type="file" id="chat-file-input" multiple style="display:none">
</div>
