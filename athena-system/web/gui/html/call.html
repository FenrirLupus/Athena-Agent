<div class="workspace" id="call-ws">
  <!-- THE CALL PAGE (the Operator's spec): a place for agents and the
       operator to call + discuss over voice. Default 2 callers minimum
       (includes the operator), max 15 — the grid grows from a 2x1 row
       to a 5x3 grid. Each caller panel is 16:9 (1280x720 HD, scaled
       down to fit). The HOTBAR switches: Start/Stop Call, Mute/Unmute
       Microphone, Add/Remove Callers. The message field is at the
       bottom. -->
  <div class="ws-head">
    <h2>Call</h2>
    <span class="ws-sub" id="call-status">2 callers · idle</span>
    <div class="ws-actions">
      <button id="call-refresh" class="call-btn" title="Reset the room">⟳ Reset</button>
    </div>
  </div>
  <!-- THE CALLER GRID (2x1 → 5x3, 16:9 HD panels). -->
  <div id="call-grid" class="call-grid"></div>
  <!-- THE HOTBAR (the Operator's spec): the button pairs that switch between
       Start/Stop Call · Mute/Unmute Microphone · Add/Remove Callers. -->
  <div id="call-hotbar" class="call-hotbar">
    <button id="call-toggle" class="call-btn call-primary" title="Start / Stop the call">▶ Start Call</button>
    <button id="call-mute" class="call-btn" title="Mute / Unmute the microphone">🎙 Mute Mic</button>
    <button id="call-add" class="call-btn" title="Add a caller (max 15)">＋ Add Caller</button>
    <button id="call-remove" class="call-btn" title="Remove a caller (min 2)">－ Remove Caller</button>
    <span id="call-count" class="call-count">2 / 15</span>
  </div>
  <!-- THE OPERATOR MESSAGE FIELD (the Operator's spec): at the bottom. -->
  <div class="call-msg-row">
    <input id="call-msg-input" type="text" autocomplete="off"
           placeholder="Message the call…" />
    <button id="call-msg-send" class="call-btn call-primary">Send</button>
  </div>
  <!-- THE CALLER PICKER (the Operator's spec): a popup list of the existing
       profiles/agents — click to add/remove a caller (no typing). -->
  <div id="call-picker" class="call-picker hidden">
    <div class="call-picker-head">
      <span id="call-picker-title">Pick a caller</span>
      <button class="call-picker-close" id="call-picker-close">✕</button>
    </div>
    <div id="call-picker-list" class="call-picker-list"></div>
  </div>
</div>
