<div class="workspace" id="vault-ws">
  <div class="ws-head">
    <h2>Vault</h2>
    <span class="ws-sub" id="vault-profile"></span>
    <div class="ws-actions">
      <button id="vault-add-row">＋ Add Row</button>
      <button id="vault-refresh">⟳ Refresh</button>
      <button id="vault-import-db" title="Import a .db file (copy-first, strict 1:1 match)">⬆ Import .db</button>
      <input type="file" id="vault-import-file" accept=".db,.sqlite,.sqlite3" style="display:none">
    </div>
  </div>
  <!-- THE VAULT ERROR (the Operator's spec): when the vault fails, the
       message renders CENTERED on the page body as
       "Vault Error: {code}" + "{message}". Hidden by default. -->
  <div id="vault-error" class="vault-error hidden">
    <div class="vault-error-code" id="vault-error-code">Vault Error</div>
    <div class="vault-error-msg" id="vault-error-msg"></div>
  </div>
  <div id="vault-grid">
    <!-- THE 08-17 LOAD-OLDER PILL (the Operator's spec): appears at the TOP
         of the vault when there are older entries, like the chat history —
         scroll to the top + click to prepend the previous page. -->
    <div id="vault-load-more-wrap" style="display:none; text-align:center; padding:6px;">
      <button id="vault-load-older" title="Load the previous page of older entries" style="display:none">Load older</button>
      <div id="vault-load-more-at-top"></div>
    </div>
    <table class="vault-table">
      <thead id="vault-grid-head"></thead>
      <tbody id="vault-grid-body"></tbody>
    </table>
  </div>
</div>
