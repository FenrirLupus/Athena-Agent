<body class="dark">
<!-- THE STARTUP OVERLAY (the Operator's 08-12 startup-gate spec): frosted
     glass, blocks ALL interaction until the startup systems finish. A
     loading bar + estimated time show boot progress. MUST be in the DOM
     BEFORE the scripts (boot.js reads it at load) — an overlay defined
     after the scripts makes the gate throw on a null element (the 08-12
     stuck-startup fix). -->
<div id="startup-overlay">
  <div class="disconnect-card">
    <div class="disconnect-logo">ATHENA</div>
    <div class="disconnect-title">Athena is coming online</div>
    <div id="startup-status" class="disconnect-sub">Initializing systems…</div>
    <div class="overlay-bar-wrap">
      <div id="startup-bar" class="overlay-bar"></div>
    </div>
    <div id="startup-eta" class="disconnect-sub">Elapsed: 0s · Estimated total: ~5s</div>
  </div>
</div>
<!-- THE DISCONNECT OVERLAY (the Operator's 08-12 spec): frosted glass.
     After 5s without the server the overlay appears; it retries every 5s
     (max 3 attempts) then shows the error state with a Reload button. -->
<div id="disconnect-overlay" class="hidden">
  <div class="disconnect-card">
    <div class="disconnect-logo">ATHENA</div>
    <div id="disconnect-title" class="disconnect-title">Athena is offline</div>
    <div id="disconnect-sub" class="disconnect-sub">Server: Offline · Runtime: Offline</div>
    <div id="disconnect-status" class="disconnect-sub">Reconnecting…</div>
    <div id="disconnect-bar-wrap" class="overlay-bar-wrap hidden">
      <div id="disconnect-bar" class="overlay-bar"></div>
    </div>
    <button id="disconnect-reload" class="disconnect-reload hidden">Reload</button>
  </div>
</div>

<!-- TAB + THEME RESTORE (the Operator's 08-12 UX fix): runs AFTER the whole
     page content is parsed but BEFORE the browser's first paint — and
     BEFORE the heavy external scripts load, so a fresh visit paints
     fast and a reload never flashes Home first (a blocking inline
     script delays paint until it finishes). -->
<script>
(function () {
  try {
    var tabs = ['home', 'chat', 'call', 'sessions', 'vault', 'behavior',
                'usage', 'settings'];
    var hash = (location.hash || '').replace('#', '');
    var saved = (tabs.indexOf(hash) !== -1) ? hash
              : (localStorage.getItem('athena-tab') || 'home');
    document.querySelectorAll('nav .tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.ws === saved);
    });
    document.querySelectorAll('.workspace').forEach(function (w) {
      w.classList.toggle('active', w.id === saved + '-ws');
    });
    // THEME RESTORE: apply the saved mode instantly (no dark/light
    // flash); theme.js refines it from config right after.
    var savedTheme = localStorage.getItem('athena-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.body.classList.toggle('dark', savedTheme === 'dark');
    }
  } catch (e) { /* never break boot */ }
})();
</script>
