<footer id="footer">
  <div class="foot-col foot-col-left">
    <span class="foot-item">Version: <b id="foot-version">—</b></span>
    <span class="foot-item">Server: <b id="foot-server">—</b></span>
    <span class="foot-item">Runtime: <b id="foot-runtime">—</b></span>
    <span class="foot-item">Plugins: <b id="foot-plugins">—</b></span>
    <span class="foot-item">Tools: <b id="foot-tools">—</b></span>
    <span class="foot-item">Skills: <b id="foot-skills">—</b></span>
  </div>
  <div class="foot-col foot-col-center">
    <span class="foot-item">Current Usage: <b id="foot-tokens-used">—</b> <span class="foot-pct" id="foot-tokens-pct">—</span></span>
    <span class="foot-item foot-bar-wrap">
      <span class="foot-bar"><span id="foot-tokens-bar"></span></span>
    </span>
    <span class="foot-item">Total Available: <b id="foot-tokens-avail">—</b> <span class="foot-pct" id="foot-tokens-avail-pct">—</span></span>
  </div>
  <!-- THE FOOTER RIGHT COLUMN (the Operator's spec): Terminal + Console.
       Terminal = the raw shell (input + history). Console = the
       organized event-metrics log. -->
  <div class="foot-col foot-col-right">
    <button id="foot-terminal-btn" class="foot-btn" title="The raw shell — input system-level commands with history">Terminal</button>
    <button id="foot-console-btn" class="foot-btn" title="The organized event-metrics log">Console</button>
  </div>
</footer>
<!-- THE TERMINAL PANEL (the Operator's spec): the raw connection + shell.
     A command input with history (up-arrow recall); output streams
     below. -->
<div id="term-panel" class="overlay-panel hidden">
  <div class="overlay-head">
    <span class="overlay-title">Terminal</span>
    <button class="overlay-close" data-close="term-panel">✕</button>
  </div>
  <div id="term-output" class="term-output"></div>
  <div class="term-input-row">
    <span class="term-prompt">$</span>
    <input id="term-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="system command — history via ↑/↓">
  </div>
</div>
<!-- THE CONSOLE PANEL (the Operator's spec): the organized metrics of the
     events we log natively. -->
<div id="console-panel" class="overlay-panel hidden">
  <div class="overlay-head">
    <span class="overlay-title">Console</span>
    <button class="overlay-close" data-close="console-panel">✕</button>
  </div>
  <div id="console-list" class="console-list"></div>
</div>
